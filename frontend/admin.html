<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow AI — Admin Portal</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="ambient-circle ambient-orange"></div>
    <div class="ambient-circle ambient-violet"></div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand-group">
                <a href="#/dashboard" class="brand-name">CampusFlow AI</a>
                <span class="brand-tagline">Admin & Faculty Portal</span>
            </div>

            <div class="top-bar-actions">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="admin-full-name" style="font-size: 13.5px; font-weight: 600; color: #FFFFFF;">Administrator</span>
                    <span class="badge badge-primary" style="background: rgba(255,255,255,0.25); color: #fff;">Staff Access</span>
                    <button id="logout-btn" class="btn btn-secondary btn-sm" style="background: rgba(255,255,255,0.18); color: #fff; border: none; padding: 5px 10px;">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Application Layout -->
    <div class="app-layout">
        <!-- Desktop Sidebar -->
        <nav class="sidebar">
            <a href="#/dashboard" class="nav-link active">📊 Insights Dashboard</a>
            <a href="#/upload" class="nav-link">📤 Upload Document</a>
            <a href="#/notices" class="nav-link">📁 Notices Manager</a>
            <a href="#/review-queue" class="nav-link">
                <span>❓ Review Queue</span>
                <span id="sidebar-review-badge" class="badge badge-accent" style="display: none; margin-left: auto; font-size: 11px; padding: 1px 6px;">0</span>
            </a>
            <a href="#/offices" class="nav-link">🏢 Campus Offices</a>

            <div style="margin-top: auto; padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12px;">
                <div style="font-weight: 700; color: var(--brand);">CampusFlow AI</div>
            </div>
        </nav>

        <!-- Dynamic Content View Area -->
        <div class="main-content">
            <main id="admin-view-container" class="page-container" aria-live="polite"></main>
        </div>
    </div>

    <!-- Mobile Bottom Tab Bar (< 768px) -->
    <nav class="mobile-tab-bar">
        <a href="#/dashboard" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📊</span><span>Stats</span>
        </a>
        <a href="#/upload" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📤</span><span>Upload</span>
        </a>
        <a href="#/notices" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📁</span><span>Notices</span>
        </a>
        <a href="#/review-queue" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>❓</span><span>Review</span>
        </a>
    </nav>

    <script type="module" src="/static/js/admin/app.js?v=38"></script>
</body>
</html>
