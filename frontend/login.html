<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow AI — Sign In</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body style="display: flex; flex-direction: column;">
    <div class="ambient-circle ambient-orange"></div>
    <div class="ambient-circle ambient-violet"></div>

    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand-group">
                <a href="/" class="brand-name">CampusFlow AI</a>
                <span class="brand-tagline">Ask. Verify. Act.</span>
            </div>
            <a href="/" class="btn btn-secondary btn-sm" style="background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 14px; text-decoration: none;">← Back to Home</a>
        </div>
    </header>

    <main class="page-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
        <div style="max-width: 440px; width: 100%;">

            <!-- Sign-In Form View -->
            <div id="login-form-view" class="card student-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <span id="role-badge" class="badge badge-category">Student Access</span>
                    <a href="/" class="btn btn-secondary btn-sm" style="padding: 4px 10px; font-size: 12px; text-decoration: none;" title="Return to home screen to switch role">Change Role</a>
                </div>

                <h2 id="login-title" style="margin-bottom: 6px;">Student Sign In</h2>
                <p id="login-subtitle" class="text-muted" style="margin-bottom: 20px; font-size: 14px;">Sign in to ask questions, view alerts, and track forms.</p>

                <div id="login-error" class="card" style="display: none; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 12px; margin-bottom: 16px; font-size: 13.5px;"></div>

                <form id="auth-form">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-input" required placeholder="Enter username" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-input" required placeholder="Enter password" autocomplete="current-password">
                            <button type="button" id="toggle-pw-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600;">SHOW</button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="btn btn-accent" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 8px;">
                        Sign In
                    </button>
                </form>

                <!-- Collapsible Demo Accounts Info -->
                <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 13px;">
                    <details>
                        <summary style="cursor: pointer; color: var(--brand); font-weight: 600;">View Demo Credentials</summary>
                        <div style="margin-top: 10px; background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);">
                            <div style="margin-bottom: 6px;"><strong>Student 1:</strong> <code>student1</code> / <code>student123</code> (Complete profile)</div>
                            <div style="margin-bottom: 6px;"><strong>Student 2:</strong> <code>student2</code> / <code>student123</code> (Partial profile)</div>
                            <div><strong>Admin:</strong> <code>admin1</code> / <code>admin123</code></div>
                        </div>
                    </details>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        import { apiPost } from "/static/js/api.js";

        let selectedRole = "student";

        function applyRole(role) {
            selectedRole = role;
            const roleCard = document.getElementById("login-form-view");
            const badge = document.getElementById("role-badge");
            const title = document.getElementById("login-title");
            const subtitle = document.getElementById("login-subtitle");
            const submitBtn = document.getElementById("submit-btn");

            if (role === "admin") {
                roleCard.className = "card admin-card";
                badge.className = "badge";
                badge.style.backgroundColor = "var(--brand-tint)";
                badge.style.color = "var(--brand)";
                badge.textContent = "Admin Staff";
                title.textContent = "Admin Portal Sign In";
                subtitle.textContent = "Sign in to publish notices, manage reviews, and view analytics.";
                submitBtn.className = "btn btn-primary";
            } else {
                roleCard.className = "card student-card";
                badge.className = "badge badge-category";
                badge.style.backgroundColor = "";
                badge.style.color = "";
                badge.textContent = "Student Access";
                title.textContent = "Student Sign In";
                subtitle.textContent = "Sign in to ask questions, view alerts, and track forms.";
                submitBtn.className = "btn btn-accent";
            }
        }

        // Show/hide password toggle
        const pwInput = document.getElementById("password");
        const toggleBtn = document.getElementById("toggle-pw-btn");
        toggleBtn.addEventListener("click", () => {
            if (pwInput.type === "password") {
                pwInput.type = "text";
                toggleBtn.textContent = "HIDE";
            } else {
                pwInput.type = "password";
                toggleBtn.textContent = "SHOW";
            }
        });

        // Form submit handler
        const form = document.getElementById("auth-form");
        const errorEl = document.getElementById("login-error");
        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorEl.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await apiPost("/auth/login", {
                    username,
                    password,
                    role: selectedRole
                });

                if (res.ok) {
                    if (res.user.role === "admin") {
                        window.location.href = "/admin";
                    } else {
                        window.location.href = "/student";
                    }
                }
            } catch (err) {
                errorEl.textContent = err.message || "Invalid credentials. Please try again.";
                errorEl.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });

        // Parse query parameter ?role=student or ?role=admin
        const urlParams = new URLSearchParams(window.location.search);
        const queryRole = urlParams.get("role");
        if (queryRole === "admin") {
            applyRole("admin");
        } else if (queryRole === "student") {
            applyRole("student");
        } else {
            // If no role is selected in URL, redirect to home screen where user chooses their portal
            window.location.href = "/";
        }
    </script>
</body>
</html>
