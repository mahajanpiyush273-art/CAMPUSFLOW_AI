<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow AI — Student Area</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div class="ambient-circle ambient-orange"></div>
    <div class="ambient-circle ambient-violet"></div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <div class="brand-group">
                <a href="#/dashboard" class="brand-name">CampusFlow AI</a>
                <span class="brand-tagline">Ask. Verify. Act.</span>
            </div>

            <!-- Global Search Box -->
            <form id="top-search-form" style="flex: 1; max-width: 420px; margin: 0 16px; position: relative;">
                <input type="text" id="top-search-input" class="form-input" placeholder="Ask question... (Press / to focus)"
                       style="padding: 7px 12px; font-size: 13.5px; border-radius: 20px; background: rgba(255,255,255,0.95);">
            </form>

            <div class="top-bar-actions">
                <!-- Notification Bell -->
                <div style="position: relative;">
                    <button id="notif-bell-btn" class="notif-bell-btn" title="Campus Alerts & Notifications">
                        🔔
                        <span id="notif-badge" class="notif-badge" style="display: none;">0</span>
                    </button>

                    <div id="notif-dropdown" class="notif-dropdown">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px;">
                            <strong style="font-size: 13.5px;">Campus Alerts</strong>
                            <button id="notif-mark-read" class="btn btn-secondary btn-sm" style="padding: 2px 6px; font-size: 11px;">Mark all read</button>
                        </div>
                        <div id="notif-list" style="max-height: 320px; overflow-y: auto;"></div>
                    </div>
                </div>

                <!-- User Profile & Logout -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="student-full-name" style="font-size: 13.5px; font-weight: 600; color: #FFFFFF;">Student</span>
                    <button id="logout-btn" class="btn btn-secondary btn-sm" style="background: rgba(255,255,255,0.18); color: #fff; border: none; padding: 5px 10px;">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Application Layout -->
    <div class="app-layout">
        <!-- Desktop Sidebar -->
        <nav class="sidebar">
            <a href="#/dashboard" class="nav-link active">📊 Dashboard</a>
            <a href="#/ask" class="nav-link">💬 Ask Assistant</a>
            <a href="#/notices" class="nav-link">📢 Notices Feed</a>
            <a href="#/handbooks" class="nav-link">📖 Handbooks & Rules</a>
            <a href="#/events" class="nav-link">🎉 Campus Events</a>
            <a href="#/forms" class="nav-link">📝 Official Forms</a>
            <a href="#/deadlines" class="nav-link">⏰ Deadlines</a>
            <a href="#/my-questions" class="nav-link">❓ My Questions</a>
            <a href="#/profile" class="nav-link">👤 My Profile</a>

            <div style="margin-top: auto; padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 12px;">
                <div style="font-weight: 700; color: var(--brand); margin-bottom: 2px;">CampusFlow AI</div>
                <div class="text-muted">Smart Campus Assistant<br>Verified Student Hub</div>
            </div>
        </nav>

        <!-- Dynamic Content View Area -->
        <div class="main-content">
            <main id="student-view-container" class="page-container" aria-live="polite"></main>
        </div>
    </div>

    <!-- Mobile Bottom Tab Bar (< 768px) -->
    <nav class="mobile-tab-bar">
        <a href="#/dashboard" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📊</span><span>Home</span>
        </a>
        <a href="#/ask" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>💬</span><span>Ask</span>
        </a>
        <a href="#/notices" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📢</span><span>Notices</span>
        </a>
        <a href="#/deadlines" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>⏰</span><span>Deadlines</span>
        </a>
        <a href="#/forms" class="mobile-tab-item nav-link" style="padding: 6px 10px; font-size: 12px; flex-direction: column; gap: 2px;">
            <span>📝</span><span>Forms</span>
        </a>
    </nav>

    <script type="module" src="/static/js/student/app.js?v=42"></script>
</body>
</html>
